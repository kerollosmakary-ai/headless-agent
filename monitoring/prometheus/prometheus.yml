global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Headless Agent Backend
  - job_name: 'headless-agent'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (if added)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

# Alerting rules
rule_files:
  - 'alerts.yml'
