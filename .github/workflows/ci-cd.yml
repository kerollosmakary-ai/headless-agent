name: CI/CD - Headless Agent Swarm

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════
  # Lint & Test
  # ═══════════════════════════════════════════════
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install PWA deps
        working-directory: ./pwa
        run: npm ci

      - name: Lint PWA
        working-directory: ./pwa
        run: npm run lint

      - name: Type-check PWA
        working-directory: ./pwa
        run: npm run typecheck

      - name: Test PWA
        working-directory: ./pwa
        run: npm run test -- --run

      - name: Install Python deps
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint Python
        working-directory: ./backend
        run: ruff check app/

      - name: Test Python
        working-directory: ./backend
        run: pytest app/ -v --tb=short

  # ═══════════════════════════════════════════════
  # Build & Push Docker Image
  # ═══════════════════════════════════════════════
  build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push PWA
        uses: docker/build-push-action@v5
        with:
          context: ./pwa
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pwa:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════
  # Deploy to Coolify (via webhook)
  # ═══════════════════════════════════════════════
  deploy-coolify:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_APP_ID: ${{ secrets.COOLIFY_APP_ID }}
    steps:
      - name: Trigger Coolify Deploy
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ env.COOLIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

      - name: Deploy via Coolify API (alternative)
        if: ${{ env.COOLIFY_API_TOKEN != '' && env.COOLIFY_API_URL != '' }}
        run: |
          curl -X POST "${{ env.COOLIFY_API_URL }}/applications/${{ env.COOLIFY_APP_ID }}/deploy" \
            -H "Authorization: Bearer ${{ env.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"force": true}'

  # Release
  # ═══════════════════════════════════════════════
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          git log --oneline --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            headless-agent-swarm.tar.gz
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
