# ──────────────────────────────────────────────
# Coolify-compatible docker-compose.yml
# ──────────────────────────────────────────────
# Coolify expects:
# - Services named explicitly (no override files needed)
# - Ports mapped to host (Coolify handles proxy)
# - Health checks for each service
# - Volumes for persistence
# ──────────────────────────────────────────────

version: '3.8'

services:
  # ═══════════════════════════════════════════════
  # Redis - Task queue & pub/sub
  # ═══════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: headless-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - headless-network

  # ═══════════════════════════════════════════════
  # Main API + PWA Server
  # ═══════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: headless-api
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_TASKS=10
      - STATIC_DIR=/app/static
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - workspace:/workspace
      - ./backend/app:/app/backend/app:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - headless-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ═══════════════════════════════════════════════
  # OpenCode Agent (sidecar - optional)
  # ═══════════════════════════════════════════════
  opencode-agent:
    image: node:20-alpine
    container_name: headless-opencode
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=8081
    command: >
      sh -c "
        npm install -g @opencode-ai/opencode@latest &&
        opencode serve --port 8081 --host 0.0.0.0
      "
    volumes:
      - workspace:/workspace
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "8081:8081"
    networks:
      - headless-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    profiles:
      - agents  # Only start with: docker compose --profile agents up

  # ═══════════════════════════════════════════════
  # Prometheus (optional - for metrics)
  # ═══════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: headless-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - headless-network
    profiles:
      - monitoring

  # ═══════════════════════════════════════════════
  # Grafana (optional)
  # ═══════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.0
    container_name: headless-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - headless-network
    profiles:
      - monitoring

volumes:
  redis_data:
    driver: local
  workspace:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  headless-network:
    driver: bridge
    name: headless-network
